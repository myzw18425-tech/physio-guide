<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087fa8"><title>Physio Guide v5</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f3f8fb;color:#173042}
header{background:linear-gradient(135deg,#087fa8,#16a6a0);color:#fff;padding:25px 18px 20px;border-radius:0 0 28px 28px;position:sticky;top:0;z-index:5}
.brand{font-size:29px;font-weight:800}.sub{opacity:.92;margin-top:5px}.search{margin-top:16px;width:100%;padding:13px;border:0;border-radius:16px;font-size:16px;outline:0}
main{max-width:960px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.item,.detail{background:#fff;border:0;border-radius:18px;box-shadow:0 5px 18px #16384d12}
.card{padding:18px;text-align:right;min-height:120px}.icon{font-size:32px}.card h3{margin:7px 0}.muted{color:#6b7f89;font-size:13px}.list{display:grid;gap:10px}.item{padding:16px;text-align:right;width:100%;font-size:15px}.back{border:0;background:#e7f3f6;padding:10px 14px;border-radius:12px;margin-bottom:12px}.detail{padding:20px}.detail h2{margin-top:0}.detail h3{color:#087fa8;margin-bottom:5px}.detail p{line-height:1.8}.fav{float:left;border:0;background:transparent;font-size:25px}.warning{background:#fff5f5;border-radius:12px;padding:12px;margin-top:15px;line-height:1.7}.source{background:#eef7fa;border-radius:12px;padding:12px;margin-top:12px;line-height:1.7}.source a{color:#087fa8;font-weight:bold}.pill{display:inline-block;background:#e8f5f6;border-radius:18px;padding:5px 9px;margin:3px;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2edf0;display:flex;justify-content:space-around;padding:8px;z-index:10;overflow:auto}
nav button{border:0;background:none;color:#536b77;font-size:10px;min-width:58px}nav b{display:block;font-size:19px}.spacer{height:72px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app"></div>
<nav><button onclick="home()"><b>🏠</b>الرئيسية</button><button onclick="list('conditions')"><b>🩺</b>الحالات</button><button onclick="list('injuries')"><b>🦴</b>الإصابات</button><button onclick="list('devices')"><b>⚡</b>الأجهزة</button><button onclick="list('exercises')"><b>🏋️</b>التمارين</button><button onclick="list('tests')"><b>📋</b>التقييم</button><button onclick="refs()"><b>📚</b>المراجع</button></nav>
<script>
const DB={
conditions:[
["ألم أسفل الظهر","Low Back Pain","العضلي الهيكلي","العمود الفقري القطني","حالة شائعة متعددة الأسباب؛ يعتمد التأهيل على التقييم والسياق السريري.","تحسين الوظيفة وتقليل أثر الأعراض واستعادة النشاط تدريجياً.",["bridge","trunk","gait"],["ROM","Strength"]],
["الفصال العظمي للركبة","Knee Osteoarthritis","العضلي الهيكلي","الركبة","اضطراب مفصلي قد يرتبط بالألم والتيبس وصعوبة بعض الأنشطة.","تحسين القوة والحركة والقدرة الوظيفية.",["squat","quad","balance"],["ROM","Strength"]],
["التهاب المفاصل الروماتويدي","Rheumatoid Arthritis","العضلي الهيكلي","مفاصل متعددة","مرض التهابي جهازي قد يؤثر في المفاصل والوظيفة.","الحفاظ على الوظيفة وإدارة الأعراض وتحسين القدرة البدنية ضمن حدود الحالة.",["rom","gait"],["ROM","Strength"]],
["الساركوبينيا","Sarcopenia","العضلي الهيكلي","العضلات","انخفاض القوة والأداء العضلي وقد يترافق مع انخفاض الكتلة العضلية.","تحسين القوة والأداء والقدرة الوظيفية.",["squat","sitstand","heel"],["Strength","Functional"]],
["الكسور","Fractures","العضلي الهيكلي","حسب موضع الكسر","إصابة عظمية تحتاج إلى تقييم وخطة طبية قبل التدرج في التحميل.","استعادة الحركة والقوة والوظيفة ضمن القيود الطبية.",["rom","gait"],["ROM","Strength"]],
["البتر","Amputation","العضلي الهيكلي","الطرف المبتور والوظائف المرتبطة","فقدان جزء من الطرف مع احتياجات تأهيلية متعددة.","تحسين الاستقلالية والوظيفة والاستعداد لاستخدام الطرف الصناعي عند ملاءمته.",["balance","gait","sitstand"],["Functional","Gait"]],
["السكتة الدماغية","Stroke","العصبي","الدماغ والجهاز العصبي","إصابة عصبية وعائية قد تؤثر في الحركة والتوازن والوظائف.","تحسين الاستقلالية والحركة والقدرات الوظيفية.",["gait","balance","sitstand"],["Gait","Balance"]],
["مرض باركنسون","Parkinson Disease","العصبي","الجهاز العصبي","اضطراب عصبي حركي قد يؤثر في الحركة والتوازن والمشي.","الحفاظ على الحركة والاستقلالية وتقليل مخاطر السقوط.",["gait","balance","trunk"],["Gait","Balance"]],
["الخرف","Dementia","العصبي","الجهاز العصبي","حالة تؤثر في الإدراك وقد ترتبط بتغيرات في الحركة والوظيفة.","الحفاظ على الوظيفة والسلامة والاستقلالية قدر الإمكان.",["gait","balance","sitstand"],["Functional","Balance"]],
["الشلل الدماغي","Cerebral Palsy","العصبي","الجهاز العصبي والحركة","اضطراب عصبي نمائي يؤثر في الحركة والوضعية بدرجات مختلفة.","تعظيم الوظيفة والمشاركة والقدرة على الحركة.",["balance","rom","gait"],["Gait","ROM"]],
["إصابة الدماغ الرضحية","Traumatic Brain Injury","العصبي","الدماغ","إصابة قد تؤثر في الحركة والتوازن والإدراك والوظائف.","استعادة الوظيفة والسلامة والمشاركة تدريجياً.",["balance","gait"],["Balance","Functional"]],
["إصابة الحبل الشوكي","Spinal Cord Injury","العصبي","الحبل الشوكي","إصابة قد تسبب تغيرات حسية وحركية ووظيفية بدرجات مختلفة.","تعظيم الاستقلالية والوظيفة ومنع المضاعفات.",["sitstand","rom"],["Functional","ROM"]],
["مرض القلب الإقفاري","Ischemic Heart Disease","القلب والرئة","الجهاز القلبي الوعائي","حالة قلبية تحتاج إلى تقييم ومراقبة مناسبة أثناء التأهيل.","تحسين القدرة الوظيفية واللياقة وفق برنامج مناسب.",["gait","breathing"],["Aerobic","Breathing"]],
["مرض الانسداد الرئوي المزمن","COPD","القلب والرئة","الجهاز التنفسي","مرض رئوي مزمن قد يؤثر في القدرة على الجهد والتنفس.","تحسين القدرة الوظيفية وتقليل أثر ضيق النفس.",["gait","breathing"],["Aerobic","Breathing"]],
["اضطراب طيف التوحد","Autism Spectrum Disorder","نمائي","التطور والوظائف","اضطراب نمائي قد يترافق مع اختلافات حسية وحركية ووظيفية.","دعم المشاركة والمهارات الحركية والوظيفية.",["balance","gait"],["Balance","Functional"]],
["اضطرابات النمو الفكري","Disorders of Intellectual Development","نمائي","التطور والوظائف","اختلافات في الوظائف المعرفية والتكيفية قد تترافق مع احتياجات حركية.","تعزيز المهارات الحركية والمشاركة والاستقلالية.",["balance","sitstand"],["Functional","Balance"]],
["ضعف البصر","Vision Impairment","حسي","الجهاز البصري","انخفاض الرؤية قد يؤثر في الحركة والسلامة.","تحسين الاستقلالية والسلامة والحركة.",["balance","gait"],["Balance","Gait"]],
["ضعف السمع","Hearing Loss","حسي","الجهاز السمعي","انخفاض السمع قد يؤثر في التواصل والمشاركة.","دعم المشاركة والتواصل والحركة ضمن الاحتياجات الفردية.",["balance"],["Balance"]],
["السرطان","Cancer","الأورام","حسب نوع وموقع المرض","حالات سرطانية متعددة قد ترتبط بأعراض وعلاجات تؤثر في الوظيفة.","الحفاظ على القدرة الوظيفية وإدارة القيود المرتبطة بالمرض والعلاج.",["gait","breathing"],["Aerobic","Functional"]],
["الفصام","Schizophrenia","الصحة النفسية","الصحة العامة والوظيفة","حالة نفسية قد ترتبط بتحديات في النشاط والصحة البدنية والمشاركة.","دعم النشاط والصحة البدنية والمشاركة ضمن الرعاية متعددة التخصصات.",["gait","balance"],["Aerobic","Functional"]]
],
injuries:["التواء الكاحل","إصابة الرباط الصليبي الأمامي","إصابة الرباط الإنسي للركبة","إصابة الغضروف الهلالي","تمزق أوتار الركبة","إصابة عضلة الربلة","إصابة وتر أخيل","تمزق الكفة المدورة","خلع الكتف","كسر الرسغ","كسر الكاحل","إصابة الرباط الوحشي للركبة","إصابة العضلة الضامة","شد عضلي","كدمة عضلية"].map(n=>[n,"Musculoskeletal Injury","إصابة الجهاز العضلي الهيكلي","حسب موضع الإصابة"]),
devices:["TENS","IFC","NMES","Therapeutic Ultrasound","Laser Therapy","Infrared","Shockwave","Cryotherapy","Heat Pack","Shortwave Diathermy","Paraffin Bath","Traction","CPM","Compression Therapy","Biofeedback","FES","EMG Biofeedback","Balance Platform","Ultraviolet Therapy","Hydrotherapy Whirlpool"].map(n=>[n,n,"وسيلة علاج طبيعي","قد تستخدم في سياقات محددة حسب الحالة والدليل وتعليمات الجهاز"]),
exercises:[
["الجسر","Bridge","الورك والجذع","bridge"],["القرفصاء الجزئي","Partial Squat","الورك والركبة","squat"],["رفع الساق المستقيمة","Straight Leg Raise","الفخذ","quad"],["مد الركبة","Knee Extension","الركبة","quad"],["ثني الركبة","Knee Flexion","الركبة","rom"],["دوران الكتف","Shoulder Rotation","الكتف","rom"],["سحب لوح الكتف","Scapular Retraction","الكتف","rom"],["تمدد الربلة","Calf Stretch","الساق","rom"],["تمدد أوتار الركبة","Hamstring Stretch","الفخذ الخلفي","rom"],["رفع الكعب","Heel Raise","الساق والكاحل","heel"],["توازن ساق واحدة","Single-Leg Balance","الكاحل","balance"],["تدريب المشي","Gait Training","وظيفي","gait"],["الجلوس والوقوف","Sit to Stand","وظيفي","sitstand"],["ضغط الحائط","Wall Push-up","الطرف العلوي","strength"],["رفع الذراع للأمام","Shoulder Flexion","الكتف","rom"],["رفع الذراع للجانب","Shoulder Abduction","الكتف","rom"],["تثبيت البطن","Abdominal Bracing","الجذع","trunk"],["إمالة الحوض","Pelvic Tilt","الحوض","trunk"],["Cat-Camel","Cat-Camel","العمود الفقري","trunk"],["دوران الجذع","Trunk Rotation","الجذع","trunk"],["تمدد مثنيات الورك","Hip Flexor Stretch","الورك","rom"],["إبعاد الورك","Hip Abduction","الورك","strength"],["تقريب الورك","Hip Adduction","الورك","strength"],["مد الورك","Hip Extension","الورك","strength"],["دوائر الكاحل","Ankle Circles","الكاحل","rom"],["مضخة الكاحل","Ankle Pumps","الكاحل","rom"],["مدى حركة الرسغ","Wrist ROM","الرسغ","rom"],["قبضة الكرة","Grip Exercise","اليد","strength"],["التنفس الحجابي","Diaphragmatic Breathing","التنفس","breathing"],["المشي التدريجي","Progressive Walking","الوظيفة والقدرة الهوائية","gait"]]
};
const TESTS=[["ROM","Range of Motion","مدى الحركة"],["MMT","Manual Muscle Testing","القوة العضلية اليدوية"],["Pain Scale","Pain Rating","شدة الألم"],["Gait Assessment","Gait Assessment","تقييم المشي"],["Balance Assessment","Balance Assessment","تقييم التوازن"],["Functional Assessment","Functional Assessment","التقييم الوظيفي"],["6MWT","6-Minute Walk Test","اختبار المشي 6 دقائق"],["TUG","Timed Up and Go","اختبار النهوض والمشي والعودة"],["Berg Balance Scale","BBS","مقياس بيرغ للتوازن"],["Spasticity Assessment","Spasticity","تقييم التشنج"]];
const TIT={conditions:"الحالات المرضية",injuries:"الإصابات",devices:"الأجهزة",exercises:"التمارين",tests:"التقييم والاختبارات"},ICON={conditions:"🩺",injuries:"🦴",devices:"⚡",exercises:"🏋️",tests:"📋"};
const F=()=>JSON.parse(localStorage.getItem("pgfav5")||"[]"),SF=x=>localStorage.setItem("pgfav5",JSON.stringify(x));
function layout(c){document.getElementById("app").innerHTML=`<header><div class=brand>Physio Guide</div><div class=sub>دليل التأهيل والعلاج الطبيعي</div><input class=search placeholder="🔎 ابحث عن حالة، إصابة، جهاز، تمرين أو اختبار..." oninput="search(this.value)"></header><main>${c}</main><div class=spacer></div>`}
function home(){layout(`<h2>مرحباً بك 👋</h2><p class=muted>مرجع تعليمي منظم لطلاب التأهيل الطبي والعلاج الطبيعي.</p><div class=grid>${Object.keys(TIT).map(k=>`<button class=card onclick="list('${k}')"><div class=icon>${ICON[k]}</div><h3>${TIT[k]}</h3><div class=muted>${k==="tests"?TESTS.length:DB[k].length} عناصر</div></button>`).join("")}</div><h2>⭐ المفضلة</h2><button class=card style="width:100%" onclick=favs()>عرض العناصر المحفوظة</button><h2>📚 المصادر</h2><button class=card style="width:100%" onclick=refs()>فتح المراجع العلمية</button>`)}
function list(k){let arr=k==="tests"?TESTS:DB[k];layout(`<button class=back onclick=home()>← الرئيسية</button><h2>${ICON[k]} ${TIT[k]}</h2><div class=list>${arr.map((x,i)=>`<button class=item onclick="detail('${k}',${i})"><strong>${x[0]}</strong><div class=muted>${x[1]||""}</div><div class=muted>${x[2]||""}</div></button>`).join("")}</div>`)}
function detail(k,i){let x=(k==="tests"?TESTS:DB[k])[i],key=k+"|"+i,fav=F().includes(key),b="";
if(k==="conditions")b=`<p>${x[4]}</p><h3>المجال</h3><p>${x[2]}</p><h3>المنطقة/الوظيفة</h3><p>${x[3]}</p><h3>أهداف التأهيل</h3><p>${x[5]}</p><h3>التمارين المرتبطة</h3>${x[6].map(id=>exerciseBtn(id)).join("")}<h3>التقييمات المرتبطة</h3>${x[7].map(t=>`<span class=pill>${t}</span>`).join("")}`;
else if(k==="injuries")b=`<h3>المنطقة</h3><p>${x[3]}</p><h3>مبدأ التأهيل</h3><p>يعتمد على نوع الإصابة وشدتها ومرحلتها والقيود الطبية والتقييم السريري.</p><h3>السلامة</h3><p>التدرج في التحميل ومراقبة الألم والتورم والوظيفة والالتزام بالتعليمات الطبية.</p>`;
else if(k==="devices")b=`<h3>التعريف</h3><p>${x[2]}</p><h3>الاستخدام</h3><p>${x[3]}</p><h3>السلامة</h3><p>يجب الرجوع إلى دليل الجهاز وموانع واحتياطات الاستخدام قبل التطبيق.</p>`;
else if(k==="exercises")b=`<h3>المنطقة المستهدفة</h3><p>${x[2]}</p><h3>الهدف التعليمي</h3><p>تحسين القوة أو الحركة أو التوازن أو الوظيفة بحسب التمرين والحالة.</p><h3>الجرعة</h3><p>تُحدد التكرارات والمقاومة والمدة وفق التقييم والقدرة والاستجابة؛ لا توجد جرعة موحدة للجميع.</p>`;
else b=`<h3>ما الذي يقيسه؟</h3><p>${x[2]}</p><h3>دوره</h3><p>يستخدم ضمن فحص شامل، ويُفسر مع التاريخ المرضي والفحص السريري والسياق الوظيفي.</p>`;
layout(`<button class=back onclick="list('${k}')">← رجوع</button><div class=detail><button class=fav onclick="toggle('${key}')">${fav?"⭐":"☆"}</button><h2>${x[0]}</h2><div class=muted>${x[1]||""}</div>${b}<div class=source><b>📚 مرجع:</b> راجع قسم المراجع داخل التطبيق للحصول على المصادر الرسمية.</div><div class=warning><b>⚠️ تنبيه:</b> هذا التطبيق تعليمي للطلاب وليس أداة لتشخيص المرضى أو وصف علاج فردي.</div></div>`)}
function exerciseBtn(id){let i=DB.exercises.findIndex(e=>e[3]===id);return i>=0?`<button class=item onclick="detail('exercises',${i})">${DB.exercises[i][0]} — ${DB.exercises[i][1]}</button>`:""}
function toggle(k){let a=F();a=a.includes(k)?a.filter(x=>x!==k):[...a,k];SF(a);let[c,i]=k.split("|");detail(c,+i)}
function favs(){
  let a=F(),r=[];
  a.forEach(k=>{
    let parts=k.split("|"),c=parts[0],i=+parts[1];
    let x=(c==="tests"?TESTS:DB[c])?.[i];
    if(x)r.push({c,i,x});
  });
  let html='<button class="back" onclick="home()">← الرئيسية</button><h2>⭐ المفضلة</h2>';
  if(r.length){
    html+='<div class="list">';
    r.forEach(z=>{html+='<button class="item" onclick="detail(\''+z.c+'\','+z.i+')"><strong>'+z.x[0]+'</strong><div class="muted">'+(z.x[1]||'')+'</div></button>';});
    html+='</div>';
  }else{html+='<p class="muted">لا توجد عناصر محفوظة.</p>';}
  layout(html);
}
function refs(){layout(`<button class=back onclick=home()>← الرئيسية</button><h2>📚 المراجع العلمية</h2><div class=list>
<div class=detail><h3>منظمة الصحة العالمية WHO — Package of Interventions for Rehabilitation</h3><p>مرجع أساسي لبنية الحالات والتدخلات والموارد في التأهيل.</p><a href="https://www.who.int/publications/i/item/9789240067097" target="_blank">فتح المرجع الرسمي ↗</a></div>
<div class=detail><h3>WHO — Musculoskeletal Module</h3><p>يشمل: ألم أسفل الظهر، الفصال العظمي، التهاب المفاصل الروماتويدي، الساركوبينيا، الكسور والبتر.</p><a href="https://www.who.int/publications/i/item/9789240071100" target="_blank">فتح المرجع ↗</a></div>
<div class=detail><h3>WHO — Neurological Web Annex</h3><p>يتضمن مراجعات الأدلة والجداول المتعلقة بالسكتة وباركنسون وإصابة الدماغ والحبل الشوكي والشلل الدماغي والخرف.</p><a href="https://www.who.int/publications/i/item/9789240071155" target="_blank">فتح المرجع ↗</a></div>
<div class=detail><h3>World Physiotherapy — Evidence-Based Practice</h3><p>مرجع لمبدأ الممارسة المبنية على أفضل الأدلة المتاحة.</p><a href="https://world.physio/policy/ps-ebp" target="_blank">فتح المرجع ↗</a></div>
</div>`)}
function search(q){
  q=q.trim().toLowerCase();
  if(!q){home();return;}
  let r=[];
  Object.keys(DB).forEach(k=>DB[k].forEach((x,i)=>{if(x.join(" ").toLowerCase().includes(q))r.push({k,i,x});}));
  TESTS.forEach((x,i)=>{if(x.join(" ").toLowerCase().includes(q))r.push({k:"tests",i,x});});
  let html='<h2>🔎 نتائج البحث</h2>';
  if(r.length){
    html+='<div class="list">';
    r.forEach(a=>{html+='<button class="item" onclick="detail(\''+a.k+'\','+a.i+')"><strong>'+a.x[0]+'</strong><div class="muted">'+(TIT[a.k]||'')+' · '+(a.x[1]||'')+'</div></button>';});
    html+='</div>';
  }else html+='<p class="muted">لا توجد نتائج.</p>';
  document.querySelector("main").innerHTML=html;
}
home();
</script></body></html>
