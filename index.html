function home(){const favCount=F().length;const recent=JSON.parse(localStorage.getItem("pgrecent2")||"[]");const recentBtns=recent.slice(0,4).map(s=>{let [k,i]=s.split("|");let arr=k==="tests"?TESTS:DB[k];return arr&&arr[+i]?`<button class=item onclick="detail('${k}',${+i})">${ICON[k]||"📌"} ${arr[+i][0]}</button>`:""}).join("");layout(`<h2>مرحباً بك 👋</h2><p class=muted>دليل تعليمي لطلاب التأهيل الطبي والعلاج الطبيعي — ابحث، راجع، واحفظ العناصر المهمة.</p><div class=quick><button onclick="searchFocus()">🔎 بحث سريع</button><button onclick="favs()">⭐ المفضلة (${favCount})</button><button onclick="showAbout()">ℹ️ عن التطبيق</button></div><div class=grid>${Object.keys(TIT).map(k=>`<button class=card onclick="list('${k}')"><div class=icon>${ICON[k]}</div><h3>${TIT[k]}</h3><div class=muted>${k==="tests"?TESTS.length:DB[k].length} عناصر</div></button>`).join("")}</div>${recentBtns?`<div class=section-title><h2>🕘 شوهدت مؤخراً</h2></div><div class=list>${recentBtns}</div>`:""}<div class=info><b>💡 طريقة الاستخدام</b><br>اختر القسم، افتح العنصر، ثم احفظه ⭐ للوصول إليه بسرعة. استخدم البحث للعثور على الحالات والإصابات والأجهزة والتمارين والاختبارات.</div><div class=danger><b>⚠️ للاستخدام التعليمي</b><br>المحتوى مرجعي للطلاب ولا يغني عن التقييم السريري أو تعليمات المشرف المختص.</div>`)}
